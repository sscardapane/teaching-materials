name: Publish teaching materials

on:
  push:
    branches: [main]
    paths:
      - 'html/**'
      - 'pdf/**'
      - 'notebooks/**'
      - 'scripts/build_site.py'
      - '.github/workflows/deploy-materials.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: html/package-lock.json
      - name: Install locked dependencies
        working-directory: html
        run: npm ci
      - name: Build course decks and downloads
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
